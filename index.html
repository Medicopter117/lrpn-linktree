<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leipzig Roleplay Network – Links</title>
<meta name="theme-color" content="#0a1230">
<style>
  :root {
    --gold: #ffd27a;
    --text: #f6f3ee;
    --muted: #c3c8e0;
    --glass: rgba(255,255,255,.09);
    --glass-hover: rgba(255,255,255,.16);
    --line: rgba(255,255,255,.20);
  }
  * { box-sizing: border-box; margin: 0; }
  html { min-height: 100%; background: #0a1230; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 80% 40% at 50% 100%, rgba(255,190,110,.55), transparent 70%),
      linear-gradient(180deg, #0a1230 0%, #16225a 45%, #5a3470 78%, #d98a62 100%);
    background-attachment: fixed;
    padding: 56px 20px 200px;
    display: flex; justify-content: center;
    overflow-x: hidden;
  }
  /* Skyline */
  .skyline {
    position: fixed; left: 0; right: 0; bottom: 0; height: 190px;
    width: 100%; pointer-events: none; z-index: 0;
  }
  main { position: relative; z-index: 1; width: 100%; max-width: 460px; }

  header { text-align: center; margin-bottom: 34px; }
  .logo {
    width: 96px; height: 96px; margin: 0 auto 20px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 30px; font-weight: 800; letter-spacing: -1px;
    color: #1a1236;
    background: radial-gradient(circle at 30% 25%, #fff0c4, var(--gold) 60%, #f0a64a);
    box-shadow: 0 0 0 6px rgba(255,210,122,.18), 0 0 40px rgba(255,200,110,.45);
  }
  h1 { font-size: 1.9rem; line-height: 1.15; letter-spacing: .01em; font-weight: 800; }
  header p { color: var(--muted); margin-top: 8px; font-size: 1rem; }

  ul { list-style: none; padding: 0; display: grid; gap: 12px; }
  a.link {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px 14px 14px;
    border-radius: 18px;
    background: var(--glass);
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: var(--text); text-decoration: none;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
  }
  a.link:hover { background: var(--glass-hover); transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,.28); }
  a.link:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .badge {
    width: 48px; height: 48px; flex: none; border-radius: 14px;
    display: grid; place-items: center;
    background: var(--c, #fff); color: var(--ic, #fff);
  }
  .badge svg { width: 26px; height: 26px; fill: currentColor; }
  .text { flex: 1; min-width: 0; }
  .label { display: block; font-weight: 700; font-size: 1.05rem; }
  .sub { display: block; font-size: .87rem; color: var(--muted); margin-top: 2px; }
  .chev { width: 20px; height: 20px; flex: none; stroke: var(--muted); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .18s ease; }
  a.link:hover .chev { transform: translateX(4px); stroke: var(--text); }

  .featured {
    background: linear-gradient(135deg, rgba(255,210,122,.30), rgba(255,210,122,.10));
    border-color: rgba(255,210,122,.65);
    padding: 18px 18px 18px 16px;
  }
  .featured .label { font-size: 1.15rem; }

  /* Einmaliger Einstieg der Liste */
  @media (prefers-reduced-motion: no-preference) {
    li { opacity: 0; animation: in .55s ease forwards; }
    li:nth-child(1) { animation-delay: .05s; } li:nth-child(2) { animation-delay: .13s; }
    li:nth-child(3) { animation-delay: .21s; } li:nth-child(4) { animation-delay: .29s; }
    li:nth-child(5) { animation-delay: .37s; }
    @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  }
  @media (prefers-reduced-motion: reduce) { a.link, .chev { transition: none; } }
  @media (max-width: 380px) { h1 { font-size: 1.6rem; } .sub { display: none; } }
</style>
</head>
